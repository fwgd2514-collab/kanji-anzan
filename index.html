<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="漢字の手書きと暗算に特化した、レベル1から100まで進むスマホ学習アプリ"
    />
    <meta name="theme-color" content="#fbfaf5" />
    <title>のびる｜漢字と暗算</title>
  </head>
  <body>
    <main class="app-shell">
      <div class="phone-app" id="app">
        <div class="static-loading" aria-live="polite">学習画面を準備しています…</div>
      </div>
    </main>
    <script>
      (() => {
        const fallbackVersion = "20260731-mikkun-steps-cards-kanji-23";
        let loadedVersion = "";
        let checkingForUpdate = false;

        function loadApplication(version) {
          if (loadedVersion) return;
          loadedVersion = String(version || fallbackVersion);
          window.__NOBIRU_APP_VERSION__ = loadedVersion;
          const versionQuery = encodeURIComponent(loadedVersion);
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = `./styles.css?v=${versionQuery}`;

          let scriptStarted = false;
          const appendScript = (source) =>
            new Promise((resolve) => {
              const script = document.createElement("script");
              script.src = source;
              script.async = false;
              script.addEventListener("load", () => resolve(true), { once: true });
              script.addEventListener("error", () => resolve(false), { once: true });
              document.body.appendChild(script);
            });

          const startScript = async () => {
            if (scriptStarted) return;
            scriptStarted = true;
            await appendScript(`./firebase-config.js?v=${versionQuery}`);
            await appendScript(`./firebase-sync.js?v=${versionQuery}`);
            const questionDataLoaded = await appendScript(`./question-data.js?v=${versionQuery}`);
            if (
              !questionDataLoaded ||
              !Array.isArray(window.NOBIRU_ADDITIONAL_KANJI) ||
              window.NOBIRU_ADDITIONAL_KANJI.length < 240
            ) {
              console.warn("追加問題ファイルを読み込めなかったため、近い難易度の問題で補います。");
            }
            await appendScript(`./app.js?v=${versionQuery}`);
          };

          stylesheet.addEventListener("load", startScript, { once: true });
          stylesheet.addEventListener("error", startScript, { once: true });
          document.head.appendChild(stylesheet);
          window.setTimeout(startScript, 3000);
        }

        async function fetchLatestVersion() {
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 2500);
          try {
            const response = await fetch(`./version.json?t=${Date.now()}`, {
              cache: "no-store",
              headers: { "Cache-Control": "no-cache" },
              signal: controller.signal,
            });
            if (!response.ok) throw new Error("version check failed");
            const data = await response.json();
            return String(data.version || fallbackVersion);
          } finally {
            window.clearTimeout(timeout);
          }
        }

        async function checkForUpdate() {
          if (
            checkingForUpdate ||
            !loadedVersion ||
            document.hidden ||
            location.protocol === "file:"
          ) {
            return;
          }
          checkingForUpdate = true;
          try {
            const latestVersion = await fetchLatestVersion();
            if (latestVersion !== loadedVersion) {
              const freshUrl = new URL(location.href);
              freshUrl.searchParams.set("updated", latestVersion);
              location.replace(freshUrl.toString());
            }
          } catch {
            // オフライン時は、すでに読み込めているアプリをそのまま利用します。
          } finally {
            checkingForUpdate = false;
          }
        }

        if (location.protocol === "file:") {
          loadApplication(fallbackVersion);
        } else {
          fetchLatestVersion()
            .then(loadApplication)
            .catch(() => loadApplication(fallbackVersion));
        }

        window.addEventListener("pageshow", (event) => {
          if (event.persisted) checkForUpdate();
        });
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) checkForUpdate();
        });
      })();
    </script>
  </body>
</html>
